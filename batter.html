<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bateador al Plato</title>
<style>
  :root{
    --ov-bg:#0b1220;--ov-stripe:#f5a623;--ov-stripe2:#ffcf6b;
    --ov-team:#f4f7fb;--ov-name:#ffffff;--ov-sub:#a9b7c9;
    --ov-statbg:#111d30;--ov-statval:#f5a623;--ov-statlbl:#a9b7c9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  body{font-family:Arial,sans-serif;color:var(--ov-name);display:inline-flex;align-items:flex-start;justify-content:flex-start;}
  /* Sin padding ni fondo en el body: solo se muestra el recuadro. */

  #card{width:620px;border-radius:10px;overflow:hidden;box-shadow:0 10px 32px rgba(0,0,0,.5);background:var(--ov-bg);display:flex;align-items:stretch;}
  #card.transp{background:transparent;box-shadow:none;}

  .bt-stripe{width:6px;flex:0 0 auto;background:linear-gradient(180deg,var(--ov-stripe2),var(--ov-stripe));}
  .bt-photo{width:104px;height:104px;flex:0 0 auto;background:#1a2536;overflow:hidden;align-self:center;margin:10px 0 10px 12px;border-radius:8px;border:2px solid var(--ov-stripe);}
  .bt-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .bt-photo.ph{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#0b1522;background:var(--ov-stripe);}

  .bt-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:8px 14px;gap:4px;}
  .bt-teamrow{display:flex;align-items:center;gap:7px;}
  .bt-logo{width:20px;height:20px;border-radius:4px;object-fit:cover;background:#fff;flex:0 0 auto;}
  .bt-logo.ph{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#0b1522;}
  .bt-team{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ov-team);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bt-name{font-family:'Barlow Condensed',Arial,sans-serif;font-size:27px;font-weight:800;line-height:1.05;color:var(--ov-name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bt-sub{font-size:11px;color:var(--ov-sub);}

  .bt-stats{display:flex;flex:0 0 auto;}
  .bt-stat{width:76px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--ov-statbg);border-left:1px solid rgba(255,255,255,.08);}
  .bt-stat .val{font-family:'Barlow Condensed',Arial,sans-serif;font-size:20px;font-weight:800;color:var(--ov-statval);line-height:1;}
  .bt-stat .lbl{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--ov-statlbl);text-transform:uppercase;}
  .bt-phaselbl{font-size:9px;color:var(--ov-sub);opacity:.75;margin-top:1px;}

  #msg{color:#cbd5e1;font-family:Arial,sans-serif;font-size:13px;background:rgba(10,14,26,.85);padding:10px 16px;border-radius:8px;}

  #gear{width:15px;height:15px;border-radius:4px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px;line-height:1;padding:0;position:fixed;top:16px;right:16px;z-index:51;}
  #gear:hover{background:rgba(255,255,255,.32);}
  #panel{position:fixed;top:40px;right:16px;width:270px;max-height:calc(100vh - 56px);overflow-y:auto;background:#111a28;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;z-index:50;font-family:Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;color:#e6edf5;}
  #panel.open{display:block;}
  #panel h3{font-size:13px;color:#f5a623;margin-bottom:10px;letter-spacing:.3px;}
  .cf-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .cf-row label{font-size:12px;color:#c7d2e0;}
  .cf-row input[type=color]{width:36px;height:26px;border:none;border-radius:5px;cursor:pointer;background:none;padding:0;}
  .cf-chk{display:flex;align-items:center;gap:7px;margin:10px 0;font-size:12px;color:#c7d2e0;}
  .cf-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .cf-btns button{flex:1;min-width:74px;font-size:11px;font-weight:700;padding:7px 6px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a2536;color:#e6edf5;cursor:pointer;}
  .cf-btns button:hover{background:#233145;}
  .cf-btns button.pri{background:#f5a623;border-color:#f5a623;color:#1a1200;}
  .cf-btns button.pri:hover{background:#e8901a;}
  #copyMsg{font-size:11px;color:#4ade80;margin-top:6px;display:none;text-align:center;}
</style>
</head>
<body>
<button id="gear" title="Personalizar colores">&#9881;</button>
<div id="panel">
  <h3>&#127912; Colores del cintillo</h3>
  <div class="cf-row"><label>Fondo</label><input type="color" id="cBg"></div>
  <div class="cf-row"><label>Franja / acento</label><input type="color" id="cStripe"></div>
  <div class="cf-row"><label>Nombre del equipo</label><input type="color" id="cTeam"></div>
  <div class="cf-row"><label>Nombre del jugador</label><input type="color" id="cName"></div>
  <div class="cf-row"><label>Texto secundario</label><input type="color" id="cSub"></div>
  <div class="cf-row"><label>Fondo de estadisticas</label><input type="color" id="cStatbg"></div>
  <div class="cf-row"><label>Valor de estadistica</label><input type="color" id="cStatval"></div>
  <div class="cf-row"><label>Etiqueta de estadistica</label><input type="color" id="cStatlbl"></div>
  <label class="cf-chk"><input type="checkbox" id="cTransp"> Fondo totalmente transparente</label>
  <div class="cf-btns">
    <button class="pri" id="btnCopy">&#128279; Copiar enlace</button>
    <button id="btnReset">&#8635; Restablecer</button>
    <button id="btnClose">Cerrar</button>
  </div>
  <div id="copyMsg">&#10003; Enlace copiado — pegalo en OBS/vMix.</div>
</div>

<div id="msg">Cargando...</div>
<div id="card" style="display:none">
  <div class="bt-stripe"></div>
  <div id="btPhotoWrap"></div>
  <div class="bt-body">
    <div class="bt-teamrow"><div id="btLogoWrap"></div><div class="bt-team" id="btTeam">Equipo</div></div>
    <div class="bt-name" id="btName">Jugador</div>
    <div class="bt-sub" id="btSub">&mdash;</div>
  </div>
  <div class="bt-stats">
    <div class="bt-stat"><div class="val" id="btAvg">.000</div><div class="lbl">AVG</div></div>
    <div class="bt-stat"><div class="val" id="btOps">.000</div><div class="lbl">OPS</div></div>
    <div class="bt-stat"><div class="val" id="btHr">0</div><div class="lbl">HR</div></div>
    <div class="bt-stat"><div class="val" id="btRbi">0</div><div class="lbl">RBI</div></div>
  </div>
</div>
<script>
// ── Bateador al Plato — cintillo estilo TV para transmision en vivo ───────
// Autonomo: no depende de sesion. ?game=<id>[&team=away|home]. Sin ?team, sigue
// AUTOMATICAMENTE al equipo que este bateando en este momento (isTop -> visitante,
// de lo contrario local). Consulta la accion publica getBatterCard, que ya calcula del
// lado del servidor los promedios de TEMPORADA (subtorneo) Y FASE actuales del juego
// (regular/playoff/serie final) para cada jugador del roster de ambos equipos.
var CFG={workerUrl:'https://api.powerrdapp.com',appToken:'68e9869114df0e1a87ee5685127c699e8019c4198645b2356995f69836ce4548'};
var qs=new URLSearchParams(location.search);
var GAME_ID=qs.get('game')||qs.get('gid')||'';
var FORCE_SIDE=qs.get('team')||''; // '' = automatico segun el inning actual
var POLL_MS=parseInt(qs.get('ms'))||6000;
var _teamsCache=null;

var COLOR_KEYS=['bg','stripe','team','name','sub','statbg','statval','statlbl'];
var DEFAULTS={bg:'#0b1220',stripe:'#f5a623',team:'#f4f7fb',name:'#ffffff',sub:'#a9b7c9',statbg:'#111d30',statval:'#f5a623',statlbl:'#a9b7c9',transp:false};
var VARMAP={bg:'--ov-bg',stripe:'--ov-stripe',team:'--ov-team',name:'--ov-name',sub:'--ov-sub',statbg:'--ov-statbg',statval:'--ov-statval',statlbl:'--ov-statlbl'};
function loadSettings(){
  var s=Object.assign({},DEFAULTS);
  try{ Object.assign(s,JSON.parse(localStorage.getItem('vp_batter_colors')||'{}')); }catch(e){}
  COLOR_KEYS.forEach(function(k){var v=qs.get(k);if(v)s[k]='#'+v.replace('#','');});
  if(qs.get('transp')!=null)s.transp=qs.get('transp')==='1';
  return s;
}
var SET=loadSettings();
function shade(hex,percent){
  hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
  var num=parseInt(hex,16),r=(num>>16)+Math.round(255*(percent/100)),g=((num>>8)&0xff)+Math.round(255*(percent/100)),b=(num&0xff)+Math.round(255*(percent/100));
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return'#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}
function applySettings(){
  COLOR_KEYS.forEach(function(k){document.documentElement.style.setProperty(VARMAP[k],SET[k]);});
  document.documentElement.style.setProperty('--ov-stripe2',shade(SET.stripe,20));
  document.getElementById('card').classList.toggle('transp',!!SET.transp);
}
function saveSettings(){localStorage.setItem('vp_batter_colors',JSON.stringify(SET));}
function syncPanelInputs(){
  document.getElementById('cBg').value=SET.bg;
  document.getElementById('cStripe').value=SET.stripe;
  document.getElementById('cTeam').value=SET.team;
  document.getElementById('cName').value=SET.name;
  document.getElementById('cSub').value=SET.sub;
  document.getElementById('cStatbg').value=SET.statbg;
  document.getElementById('cStatval').value=SET.statval;
  document.getElementById('cStatlbl').value=SET.statlbl;
  document.getElementById('cTransp').checked=!!SET.transp;
}
function wirePanel(){
  var map={cBg:'bg',cStripe:'stripe',cTeam:'team',cName:'name',cSub:'sub',cStatbg:'statbg',cStatval:'statval',cStatlbl:'statlbl'};
  Object.keys(map).forEach(function(id){
    document.getElementById(id).addEventListener('input',function(){SET[map[id]]=this.value;applySettings();saveSettings();});
  });
  document.getElementById('cTransp').addEventListener('change',function(){SET.transp=this.checked;applySettings();saveSettings();});
  document.getElementById('btnReset').addEventListener('click',function(){SET=Object.assign({},DEFAULTS);applySettings();saveSettings();syncPanelInputs();});
  document.getElementById('btnCopy').addEventListener('click',function(){
    var u=new URL(location.href);
    COLOR_KEYS.forEach(function(k){u.searchParams.set(k,SET[k].replace('#',''));});
    u.searchParams.set('transp',SET.transp?'1':'0');u.searchParams.set('edit','0');
    navigator.clipboard.writeText(u.href).then(function(){
      var m=document.getElementById('copyMsg');m.style.display='block';setTimeout(function(){m.style.display='none';},2500);
    });
  });
  document.getElementById('btnClose').addEventListener('click',function(){document.getElementById('panel').classList.remove('open');});
  document.getElementById('gear').addEventListener('click',function(){document.getElementById('panel').classList.toggle('open');});
}
applySettings();
if(qs.get('edit')==='0'){document.getElementById('gear').style.display='none';}
else{syncPanelInputs();wirePanel();}

function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt3(v){
  v=v||0;
  if(v>=1) return v.toFixed(3);
  return v.toFixed(3).replace(/^0\./,'.');
}
async function apiCall(action,data){
  var r=await fetch(CFG.workerUrl,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':CFG.appToken},body:JSON.stringify(Object.assign({action:action},data||{}))});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
async function ensureTeams(){
  if(_teamsCache)return _teamsCache;
  var res=await apiCall('getAll',{});
  if(!res.ok)throw new Error(res.error||'No se pudo cargar equipos');
  var map={};(res.data&&res.data.teams||[]).forEach(function(t){map[t.id]=t;});
  _teamsCache=map;return map;
}
function logoHtml(team,wrapId){
  var wrap=document.getElementById(wrapId);if(!wrap)return;
  if(team&&team.logoUrl){
    wrap.innerHTML='<img class="bt-logo" src="'+esc(team.logoUrl)+'" onerror="this.outerHTML=\'<div class=&quot;bt-logo ph&quot; style=&quot;background:'+esc(team&&team.color||'#f5a623')+'&quot;>'+esc((team&&team.name||'?').charAt(0))+'</div>\'">';
  } else {
    wrap.innerHTML='<div class="bt-logo ph" style="background:'+esc(team&&team.color||'#f5a623')+'">'+esc((team&&team.name||'?').charAt(0))+'</div>';
  }
}
function photoHtml(player){
  var wrap=document.getElementById('btPhotoWrap');if(!wrap)return;
  var initial=esc((player&&player.name?player.name[0]:'?').toUpperCase());
  if(player&&player.photoUrl){
    wrap.innerHTML='<div class="bt-photo"><img src="'+esc(player.photoUrl)+'" alt="" onerror="this.parentNode.className=\'bt-photo ph\';this.parentNode.textContent=\''+initial+'\'"></div>';
  } else {
    wrap.innerHTML='<div class="bt-photo ph">'+initial+'</div>';
  }
}
// Orden de bateo ACTIVO (sustituciones/no-bate aplicadas) — MISMA logica que usa
// Control de Juego (index.html) para determinar quien esta realmente al bate ahora mismo.
function activeBattingOrder(lineups,teamId){
  var lu=(lineups||[]).filter(function(l){return l.teamId===teamId;})[0];
  if(!lu||!lu.players||!lu.players.length)return[];
  var rpIds=lu.players.filter(function(lp){return lp.replacedBy||lp.noBat;}).map(function(lp){return lp.playerId;});
  var slots=[];
  lu.players.forEach(function(lp){var s=lp.order||0;if(slots.indexOf(s)<0)slots.push(s);});
  slots.sort(function(a,b){return a-b;});
  var ordered=[];
  slots.forEach(function(slot){
    var inSlot=lu.players.filter(function(lp){return(lp.order||0)===slot;});
    var cur=inSlot.filter(function(lp){return rpIds.indexOf(lp.playerId)<0;});
    if(cur.length===0){
      var allNoBat=inSlot.every(function(lp){return lp.noBat===true||lp.noBat==='true';});
      if(allNoBat)return;
      ordered.push(inSlot[inSlot.length-1]);
    } else {
      ordered.push(cur[cur.length-1]);
    }
  });
  if(!ordered.length)ordered=lu.players.slice();
  return ordered;
}
var PHASE_LBL={regular:'Serie Regular',playoff:'Playoffs',final:'Serie Final'};
function render(gm,teams,players,lineups,statsByPlayerId,targetPhase){
  var isTop=gm.currentHalf==='top';
  var side=FORCE_SIDE==='home'||FORCE_SIDE==='away'?FORCE_SIDE:(isTop?'away':'home');
  var teamId=side==='home'?gm.homeTeamId:gm.awayTeamId;
  var team=teams[teamId]||{name:side==='home'?'Local':'Visitante'};
  var idx=side==='away'?(parseInt(gm.awayBatterIdx)||0):(parseInt(gm.homeBatterIdx)||0);
  var ordered=activeBattingOrder(lineups,teamId);
  if(!ordered.length){
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').textContent='Sin alineacion registrada para este equipo aun.';
    document.getElementById('card').style.display='none';
    return;
  }
  var len=ordered.length;
  var slot=ordered[idx%len];
  var player=slot?players[slot.playerId]:null;
  if(!player){
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').textContent='No se pudo determinar el bateador actual.';
    document.getElementById('card').style.display='none';
    return;
  }
  document.getElementById('msg').style.display='none';
  document.getElementById('card').style.display='flex';
  photoHtml(player);
  logoHtml(team,'btLogoWrap');
  document.getElementById('btTeam').textContent=team.name||'Equipo';
  document.getElementById('btName').textContent='#'+(player.number||'?')+' '+(player.name||'?');
  document.getElementById('btSub').innerHTML=(idx%len+1)+'&ordm; en orden &middot; '+(PHASE_LBL[targetPhase]||'Serie Regular');
  var st=(statsByPlayerId&&statsByPlayerId[player.id])||{avg:0,ops:0,hr:0,rbi:0};
  document.getElementById('btAvg').textContent=fmt3(st.avg);
  document.getElementById('btOps').textContent=fmt3(st.ops);
  document.getElementById('btHr').textContent=parseInt(st.hr)||0;
  document.getElementById('btRbi').textContent=parseInt(st.rbi)||0;
  document.title='Al Bate — '+(player.name||'')+' ('+team.name+')';
}
var _pollTimer=null,_errCount=0;
async function poll(){
  try{
    if(!GAME_ID){document.getElementById('msg').textContent='Falta el parametro ?game=ID en la URL.';return;}
    var teams=await ensureTeams();
    var res=await apiCall('getBatterCard',{gameId:GAME_ID});
    if(!res.ok){document.getElementById('msg').style.display='block';document.getElementById('msg').textContent=res.error||'Juego no encontrado.';document.getElementById('card').style.display='none';return;}
    _errCount=0;
    var players={};(res.data.players||[]).forEach(function(p){players[p.id]=p;});
    render(res.data.game,teams,players,res.data.lineups||[],res.data.statsByPlayerId||{},res.data.targetPhase);
  }catch(e){
    _errCount++;
    if(_errCount>2&&document.getElementById('card').style.display==='none'){document.getElementById('msg').style.display='block';document.getElementById('msg').textContent='Sin conexion, reintentando...';}
  }finally{ _pollTimer=setTimeout(poll,POLL_MS); }
}
poll();
document.addEventListener('visibilitychange',function(){ if(!document.hidden){clearTimeout(_pollTimer);poll();} });
</script>
</body>
</html>
